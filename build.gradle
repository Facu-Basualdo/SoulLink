plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	// Cardinal Components: la API vieja de Trinkets (1.21.x) guarda los slots en un componente suyo
	exclusiveContent {
		forRepository {
			maven {
				name = "Ladysnake"
				url = "https://maven.ladysnake.org/releases"
			}
		}
		filter {
			includeGroup "org.ladysnake.cardinal-components-api"
		}
	}
}

loom {
	// src/client: sólo la pantalla de configuración de Mod Menu. Así src/main no puede usar por error una clase de
	// net.minecraft.client, que en un servidor dedicado no está
	splitEnvironmentSourceSets()

	mods {
		"soullink" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// Segundo cliente para probar con 2 jugadores a la vez: gradlew runClient2
		client2 {
			client()
			configName = "Minecraft Client 2"
			programArgs "--username", "Jugador2"
			runDir "run-client2"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Esta versión de Minecraft todavía viene ofuscada: con los nombres oficiales de Mojang el código queda igual
	// que en la rama de 26.x
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod Menu es opcional: sólo para compilar ModMenuIntegration, que Mod Menu carga si está instalado
	modCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"

	// Minecraft 26.x trae las anotaciones de JSpecify y 1.21.1 no: sólo hacen falta para compilar
	compileOnly "org.jspecify:jspecify:1.0.0"

	// Trinkets Updated es opcional: con él se comparten también sus slots (com.soullink.trinkets). Las pruebas corren con él.
	modCompileOnly "maven.modrinth:trinkets:${project.trinkets_version}"
	// Trinkets lo trae adentro de su jar, pero para compilar contra su API hace falta verlo
	modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.3"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

// MIT pide que el aviso de copyright viaje con cada copia, y el jar es la copia que circula.
jar {
	from("LICENSE")
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Pruebas automáticas dentro del juego (src/gametest): gradlew runGameTest (servidor sin ventana) y
// gradlew runClientGameTest (abre un cliente de verdad para probar la pantalla de configuración)
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "soullink-test"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

// Las pruebas corren con Trinkets Updated para probar que sus slots también se comparten
dependencies {
	modGametestImplementation "maven.modrinth:trinkets:${project.trinkets_version}"
	// En desarrollo Loom no carga los jars que Trinkets trae adentro
	modGametestImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.3"
	modGametestImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:6.1.3"
}

// El cliente de prueba guarda su config en build/run/clientGameTest y no la pisa: la prueba de la pantalla de
// configuración le cambia valores, y la corrida siguiente tiene que arrancar con los por defecto
def configDelClienteDePrueba = layout.buildDirectory.dir("run/clientGameTest/config")
tasks.matching { it.name == "runClientGameTest" }.configureEach {
	doFirst {
		configDelClienteDePrueba.get().asFile.deleteDir()
	}
}
